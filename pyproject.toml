[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mplssim"
version = "2.1.0"
description = "Flow-level MPLS traffic-engineering simulator and a controlled study of sequential RL versus contextual decision-making"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Uğur Efe Yiğit"}]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "networkx>=3.2", "pyyaml>=6.0",
  "pydantic>=2.5", "gymnasium>=0.29", "torch>=2.6", "stable-baselines3>=2.3",
  "sb3-contrib>=2.3", "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0", "httpx>=0.27"]
dev = ["pytest>=8.0", "tensorboard>=2.16"]

[tool.setuptools.packages.find]
include = ["mplssim*", "server*"]
