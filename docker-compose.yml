# Single-service deployment: simulation, RL inference, API and frontend are one
# Python process (see docs/ADR-001). Volumes keep models/results on the host.
services:
  mpls-te:
    build: .
    ports:
      - "8000:8000"
    environment:
      # A container is the most likely "someone else runs the demo" path, so the
      # training endpoint is off by default here. Override to "true" if you
      # genuinely intend to train inside the container.
      ALLOW_TRAINING: "false"
    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./runs:/app/runs
