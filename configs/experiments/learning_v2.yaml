version: learning-v2.0
environment_version: v2
algorithms: [maskable_ppo, masked_bandit]

training_roots: [42, 314159, 271828]
active_training_roots: [42, 314159, 271828]
continuity_seeds: [101, 102, 103, 104, 105]
holdout_seeds: [1001, 1002, 1003, 1004, 1005]

training:
  scenario: random_day
  aggregate_transitions: 400000
  checkpoint_interval: 50000
  vector_candidates: [8, 12, 16]
  device: auto

evaluation:
  scenarios:
    - full_day
    - evening_peak
    - flash_crowd
    - link_failure
    - deceptive_local_optimum
    - ood_double_failure
    - overload_stress
  deterministic: true

masked_bandit:
  network: [256, 256]
  optimizer: adam
  learning_rate: 3.0e-4
  batch_size: 512
  replay_capacity: 100000
  warmup_transitions: 4096
  update_every_vector_steps: 4
  exploration:
    rule: masked_epsilon_greedy
    initial_epsilon: 0.20
    final_epsilon: 0.02
    decay_transitions: 200000
  target: immediate_observed_reward
  loss: huber
  reward_scaling: none
  gradient_clip_norm: 1.0
