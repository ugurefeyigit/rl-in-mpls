  - {id: L1,  a: PE1, z: P1, capacity_mbps: 1000, delay_ms: 2, weight: 10}
  - {id: L2,  a: PE2, z: P1, capacity_mbps: 500,  delay_ms: 2, weight: 20}
  - {id: L3,  a: PE2, z: P2, capacity_mbps: 500,  delay_ms: 2, weight: 20}
  - {id: L4,  a: PE3, z: P2, capacity_mbps: 1000, delay_ms: 2, weight: 10}
  - {id: L5,  a: PE3, z: P3, capacity_mbps: 500,  delay_ms: 2, weight: 20}
  - {id: L6,  a: PE4, z: P3, capacity_mbps: 1000, delay_ms: 2, weight: 10}
  - {id: L7,  a: PE1, z: P2, capacity_mbps: 250,  delay_ms: 3, weight: 40}
  - {id: L8,  a: PE4, z: P2, capacity_mbps: 250,  delay_ms: 3, weight: 40}
  # --- West core to middle core ---
  - {id: L9,  a: P1, z: P4, capacity_mbps: 1000, delay_ms: 3, weight: 10}
  - {id: L10, a: P1, z: P5, capacity_mbps: 500,  delay_ms: 3, weight: 20}
  - {id: L11, a: P2, z: P5, capacity_mbps: 2000, delay_ms: 3, weight: 5}
  - {id: L12, a: P2, z: P6, capacity_mbps: 500,  delay_ms: 4, weight: 20}
