# MPLS backbone topology: 18 routers, 28 undirected links (56 directed).
# Roles: PE_IN (ingress LER), PE_OUT (egress LER), P (core LSR), AGG (aggregation LSR).
# capacity_mbps is per direction. delay_ms is one-way propagation delay.
# weight is the administrative IGP/TE metric used by shortest-path and CSPF.
#
# Engineered properties (referenced in docs/ARCHITECTURE.md):
#   - Hidden shared bottleneck: shortest paths from PE1/PE2 toward PE5/PE6 funnel
#     through P5->P8 (1000 Mbps) even though P2-P5 is a 2000 Mbps backbone.
#     The detour via P6->A1 avoids it at +2 hops.
#   - Longer-but-better region: P4-P7 (250 Mbps, weight 60) is a long detour that
#     is only useful under failures; naive shortest-path never uses it.
#   - Redundancy ring: P4-P5-P6-P7 vertical segments plus A1-A2.
#   - Critical failure link: P2-P5 (2 Gbps backbone). Its loss forces mass rerouting.

routers:
  - {id: PE1, role: PE_IN,  x: 60,  y: 90}
  - {id: PE2, role: PE_IN,  x: 60,  y: 240}
  - {id: PE3, role: PE_IN,  x: 60,  y: 390}
  - {id: PE4, role: PE_IN,  x: 60,  y: 540}
  - {id: P1,  role: P,      x: 280, y: 120}
  - {id: P2,  role: P,      x: 280, y: 300}
  - {id: P3,  role: P,      x: 280, y: 480}
  - {id: P4,  role: P,      x: 500, y: 70}
  - {id: P5,  role: P,      x: 500, y: 230}
  - {id: P6,  role: P,      x: 500, y: 400}
  - {id: P7,  role: P,      x: 500, y: 560}
  - {id: P8,  role: P,      x: 720, y: 120}
  - {id: A1,  role: AGG,    x: 720, y: 320}
  - {id: A2,  role: AGG,    x: 720, y: 500}
  - {id: PE5, role: PE_OUT, x: 940, y: 90}
  - {id: PE6, role: PE_OUT, x: 940, y: 240}
  - {id: PE7, role: PE_OUT, x: 940, y: 390}
  - {id: PE8, role: PE_OUT, x: 940, y: 540}

links:
