id: E3_ppo_tuning
description: >
  Bounded one-factor-at-a-time PPO sensitivity around the governed default
  (lr 3e-4, n_steps 512 x 16 envs, batch 512, 8 epochs, clip 0.2, ent 0.01,
  gamma 0.995, GAE 0.95, [256,256]). Selection uses VALIDATION seeds only.
  The best configuration is then trained on the remaining preregistered roots
  (family E3b, added after selection; see docs/EXPERIMENT_LOG.md).
env: {variant: base}
budget: {transitions: 400000, checkpoint_interval: 50000, n_envs: 16}
roots: [42]
runs:
  - {tag: lr1e4,  algorithm: maskable_ppo, overrides: {learning_rate: 1.0e-4}}
  - {tag: lr1e3,  algorithm: maskable_ppo, overrides: {learning_rate: 1.0e-3}}
  - {tag: ns128,  algorithm: maskable_ppo, overrides: {n_steps: 128, batch_size: 256}}
  - {tag: ns2048, algorithm: maskable_ppo, overrides: {n_steps: 2048, batch_size: 1024}}
  - {tag: ent0,   algorithm: maskable_ppo, overrides: {ent_coef: 0.0}}
  - {tag: ent003, algorithm: maskable_ppo, overrides: {ent_coef: 0.03}}
  - {tag: clip01, algorithm: maskable_ppo, overrides: {clip_range: 0.1}}
  - {tag: net64,  algorithm: maskable_ppo, overrides: {policy_kwargs: {net_arch: [64, 64]}}}
